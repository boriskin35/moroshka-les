name: Deploy to Surge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-surge
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Surge
        run: npx surge dist moroshkales.com --token ${{ secrets.SURGE_TOKEN }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN || 'Julia-xanti@yandex.ru' }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
