name: Deploy to Reg.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-regru
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Sync files to Reg.ru via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 37.140.192.135
          username: u3707745
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: www/moroshkales.com/
          local-dir: ./dist/
          dangerous-clean-slate: false
